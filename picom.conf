#################################
# Backend (IMPORTANT FOR AMD)
#################################
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

#################################
# VSync (prevents tearing)
#################################
vsync = true;
xrender-sync-fence = true;

#################################
# Shadows (light, clean)
#################################
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.35;
shadow-offset-x = -6;
shadow-offset-y = -6;

shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'i3bar'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
# Fading (fast, no lag)
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'i3bar'"
];

#################################
# Transparency
#################################
inactive-opacity = 0.90;
active-opacity = 1.0;
frame-opacity = 1.0;

#################################
# Blur (disable for max FPS)
#################################
blur-method = "none";

#################################
# Window types
#################################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.90; };
  dropdown_menu = { shadow = false; };
  popup_menu = { shadow = false; };
  dnd = { shadow = false; };
};

#################################
# Performance (AMD friendly)
#################################
unredir-if-possible = false;
detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;

